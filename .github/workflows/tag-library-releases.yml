name: Tag Library Releases
# Tags main with vX.Y.Z for each datajoint-python release, at the last commit
# on main when that release was published. Tag placement depends only on the
# publish time, so a daily run loses nothing; the first run backfills.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tag main at each datajoint-python release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/tag_library_releases.py
