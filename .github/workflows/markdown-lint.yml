name: Markdown Lint
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swallowed-lists:
    name: Check for swallowed Markdown lists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # A list with no blank line after its paragraph lead-in renders as a
      # run-on paragraph with literal dashes. MkDocs does not warn, so the
      # page just quietly looks wrong.
      - name: Check list spacing
        run: python scripts/check_markdown_lists.py src
