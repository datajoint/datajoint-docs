name: Markdown Lint
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swallowed-lists:
    name: Check for swallowed Markdown lists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # A list with no blank line after its paragraph lead-in renders as a
      # run-on paragraph with literal dashes. MkDocs does not warn, so the
      # page just quietly looks wrong.
      - name: Check list spacing
        run: python scripts/check_markdown_lists.py src
