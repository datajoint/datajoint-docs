name: Link Check
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check internal links in source files
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path src/api
            --exclude-path src/elements
            --exclude '^https?://'
            --exclude 'api/datajoint'
            --exclude 'elements/element-'
            'src/**/*.md'
            'src/**/*.ipynb'
          fail: true

  # The check above resolves links against the *source* tree, which cannot see
  # this class of bug: mkdocs-jupyter does not rewrite relative links inside
  # notebook markdown cells, so a source-valid link like
  # `../explanation/entity-integrity.md` ships verbatim and 404s. Only the built
  # output shows what a reader's browser actually requests.
  built-site:
    name: Check internal links in the built site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pip_requirements.txt

      - name: Install docs toolchain
        run: pip install -r pip_requirements.txt

      - name: Build site
        run: mkdocs build --strict --site-dir site

      - name: Check internal links
        run: python scripts/check_links.py site
