<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Roboto, Helvetica, sans-serif">
  <defs>
    <style>
      .frame { fill: #FFFFFF; stroke: #171C39; }
      .boundary { fill: #FFFFFF; stroke: #171C39; }
      .box { fill: #F0F0F1; stroke: #171C39; }
      .core-panel { fill: #FFFFFF; stroke: #FF5113; }
      .accent { fill: #00A0DF; }
      .accent-stroke { stroke: #00A0DF; }
      .ink { fill: #171C39; }
      .on-accent { fill: #FFFFFF; }
      .caption { fill: #808285; }
      .band { fill: #00A0DF; fill-opacity: 0.10; }
      .platform-label { font-size: 17px; fill: #00A0DF; font-weight: 700; text-anchor: middle; letter-spacing: 1.5px; }
      .comp-label { font-size: 12px; fill: #171C39; font-weight: 600; letter-spacing: 0.3px; }
      .core-label { font-size: 12px; fill: #FF5113; font-weight: 700; text-anchor: middle; letter-spacing: 0.8px; }
      .core-sub { font-size: 10px; fill: #808285; text-anchor: middle; font-style: italic; }
      .tagline { font-size: 12px; fill: #808285; text-anchor: middle; font-style: italic; }
      .band-label { font-size: 12px; fill: #00A0DF; font-weight: 600; text-anchor: middle; letter-spacing: 1px; }
      @media (prefers-color-scheme: dark) {
        .frame, .boundary { fill: #161A21; stroke: #8A93A1; }
        .box { fill: #242832; stroke: #8A93A1; }
        .core-panel { fill: #1E232C; stroke: #FF7A47; }
        .accent { fill: #33B8E8; }
        .accent-stroke { stroke: #33B8E8; }
        .ink { fill: #C9CFD9; }
        .on-accent { fill: #161A21; }
        .caption { fill: #9DA0A4; }
        .band { fill: #33B8E8; }
        .platform-label, .band-label { fill: #33B8E8; }
        .comp-label { fill: #C9CFD9; }
        .core-label { fill: #FF7A47; }
        .core-sub, .tagline { fill: #9DA0A4; }
      }
    </style>
  </defs>

  <!-- ========== PLATFORM BOUNDARY ========== -->
  <rect x="60" y="40" width="780" height="500" rx="24" class="boundary" stroke-width="1.5"/>
  <text x="450" y="68" class="platform-label">DATAJOINT PLATFORM</text>

  <!-- ========== AI INTERFACE — prominent, full-width ========== -->
  <g transform="translate(450, 106)">
    <rect x="-340" y="-26" width="680" height="50" rx="10" class="box" stroke-width="1"/>
    <!-- Robot icon -->
    <rect x="-130" y="-16" width="24" height="20" rx="4" class="accent"/>
    <circle cx="-122" cy="-6" r="3.5" class="on-accent"/>
    <circle cx="-112" cy="-6" r="3.5" class="on-accent"/>
    <line x1="-117" y1="-19" x2="-117" y2="-25" class="accent-stroke" stroke-width="2"/>
    <circle cx="-117" cy="-26" r="2.5" class="accent"/>
    <text x="0" y="5" class="comp-label" style="font-size:15px; font-weight:700; text-anchor:middle;">AI INTERFACE</text>
  </g>

  <!-- ========== SERVICE ROW ========== -->
  <g transform="translate(195, 178)">
    <rect x="-115" y="-28" width="230" height="54" rx="10" class="box" stroke-width="1"/>
    <!-- Graph icon -->
    <circle cx="-76" cy="-1" r="9" class="accent"/>
    <circle cx="-58" cy="-14" r="7" class="accent"/>
    <circle cx="-58" cy="12" r="7" class="accent"/>
    <line x1="-70" y1="-3" x2="-63" y2="-11" class="accent-stroke" stroke-width="1.5"/>
    <line x1="-70" y1="2" x2="-63" y2="9" class="accent-stroke" stroke-width="1.5"/>
    <text x="-38" y="4" class="comp-label">NAVIGATOR</text>
  </g>

  <g transform="translate(450, 178)">
    <rect x="-115" y="-28" width="230" height="54" rx="10" class="box" stroke-width="1"/>
    <!-- Arrow-into-box icon -->
    <rect x="-68" y="-14" width="26" height="24" rx="4" class="accent"/>
    <path d="M-94,0 L-72,0 M-82,-8 L-72,0 L-82,8" fill="none" class="accent-stroke" stroke-width="2.5"/>
    <text x="-30" y="-4" class="comp-label">DATA INGEST</text>
    <text x="-30" y="12" class="comp-label">+ INTEGRATION</text>
  </g>

  <g transform="translate(705, 178)">
    <rect x="-115" y="-28" width="230" height="54" rx="10" class="box" stroke-width="1"/>
    <!-- Shield icon -->
    <path d="M-84,-18 L-84,4 Q-84,16 -71,20 Q-58,16 -58,4 L-58,-18 L-71,-24 Z" class="accent"/>
    <text x="-42" y="-4" class="comp-label">SECURITY + INFRA</text>
    <text x="-42" y="12" class="comp-label">+ COMPUTE</text>
  </g>

  <!-- ========== OPEN-SOURCE CORE (the platform core panel — orange, used once) ========== -->
  <rect x="230" y="240" width="440" height="90" rx="12" class="core-panel" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="450" y="258" class="core-label">OPEN-SOURCE CORE</text>
  <text x="450" y="272" class="core-sub">schema + workflow</text>

  <g transform="translate(310, 305)">
    <rect x="-48" y="-20" width="96" height="40" rx="8" class="box" stroke-width="1"/>
    <!-- DB icon -->
    <ellipse cx="-22" cy="-8" rx="10" ry="4" class="accent"/>
    <path d="M-32,-8 v12 a10,4 0 0,0 20,0 v-12" class="accent" fill-opacity="0.6"/>
    <text x="10" y="-3" class="comp-label" style="font-size:9px;">RELATIONAL</text>
    <text x="10" y="8" class="comp-label" style="font-size:9px;">DATABASE</text>
  </g>

  <g transform="translate(450, 305)">
    <rect x="-48" y="-20" width="96" height="40" rx="8" class="box" stroke-width="1"/>
    <text x="-22" y="4" text-anchor="middle" font-size="18" font-weight="600" class="accent">&lt;/&gt;</text>
    <text x="10" y="-3" class="comp-label" style="font-size:9px;">CODE</text>
    <text x="10" y="8" class="comp-label" style="font-size:9px;">REPO</text>
  </g>

  <g transform="translate(590, 305)">
    <rect x="-48" y="-20" width="96" height="40" rx="8" class="box" stroke-width="1"/>
    <!-- Bucket icon -->
    <path d="M-30,-8 L-32,4 Q-32,10 -22,10 Q-12,10 -12,4 L-14,-8 Q-14,-12 -22,-12 Q-30,-12 -30,-8 Z" class="accent" fill-opacity="0.6"/>
    <ellipse cx="-22" cy="-8" rx="9" ry="3.5" class="accent"/>
    <text x="10" y="-3" class="comp-label" style="font-size:9px;">OBJECT</text>
    <text x="10" y="8" class="comp-label" style="font-size:9px;">STORE</text>
  </g>

  <!-- ========== BOTTOM ROW ========== -->
  <g transform="translate(168, 395)">
    <rect x="-80" y="-30" width="160" height="58" rx="10" class="box" stroke-width="1"/>
    <!-- Notebook icon -->
    <rect x="-66" y="-20" width="24" height="34" rx="3" class="accent"/>
    <line x1="-58" y1="-20" x2="-58" y2="14" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="-55" y1="-10" x2="-46" y2="-10" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="-55" y1="-3" x2="-46" y2="-3" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="-55" y1="4" x2="-49" y2="4" stroke="#FFFFFF" stroke-width="1.2"/>
    <text x="-32" y="-5" class="comp-label" style="font-size:11px;">ELECTRONIC</text>
    <text x="-32" y="10" class="comp-label" style="font-size:11px;">LAB NOTEBOOK</text>
  </g>

  <g transform="translate(355, 395)">
    <rect x="-80" y="-30" width="160" height="58" rx="10" class="box" stroke-width="1"/>
    <!-- Terminal icon -->
    <rect x="-66" y="-18" width="30" height="28" rx="4" class="accent"/>
    <path d="M-59,-8 L-49,-1 L-59,6" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="-47" y1="7" x2="-40" y2="7" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="-26" y="-5" class="comp-label" style="font-size:11px;">INTEGRATED DEV</text>
    <text x="-26" y="10" class="comp-label" style="font-size:11px;">ENVIRONMENT</text>
  </g>

  <g transform="translate(543, 395)">
    <rect x="-80" y="-30" width="160" height="58" rx="10" class="box" stroke-width="1"/>
    <!-- Chart icon -->
    <rect x="-66" y="0" width="11" height="16" rx="2" class="accent" fill-opacity="0.6"/>
    <rect x="-53" y="-8" width="11" height="24" rx="2" class="accent" fill-opacity="0.8"/>
    <rect x="-40" y="-16" width="11" height="32" rx="2" class="accent"/>
    <text x="-18" y="-5" class="comp-label" style="font-size:11px;">VISUALIZATION</text>
    <text x="-18" y="10" class="comp-label" style="font-size:11px;">DASHBOARD</text>
  </g>

  <g transform="translate(730, 395)">
    <rect x="-80" y="-30" width="160" height="58" rx="10" class="box" stroke-width="1"/>
    <!-- Share/network icon -->
    <circle cx="-58" cy="-2" r="8" class="accent"/>
    <circle cx="-40" cy="-16" r="6" class="accent" fill-opacity="0.8"/>
    <circle cx="-40" cy="12" r="6" class="accent" fill-opacity="0.8"/>
    <line x1="-51" y1="-6" x2="-45" y2="-12" class="accent-stroke" stroke-width="1.5"/>
    <line x1="-51" y1="2" x2="-45" y2="8" class="accent-stroke" stroke-width="1.5"/>
    <text x="-24" y="-5" class="comp-label" style="font-size:11px;">COLLABORATION</text>
    <text x="-24" y="10" class="comp-label" style="font-size:11px;">+ PUBLISHING</text>
  </g>

  <!-- ========== GOVERNED EXECUTION BAR ========== -->
  <rect x="90" y="465" width="720" height="28" rx="6" class="band"/>
  <text x="450" y="483" class="band-label">REPRODUCIBILITY &#x2022; PROVENANCE &#x2022; INTEGRITY &#x2022; COLLABORATION</text>

  <!-- ========== TAGLINE ========== -->
  <text x="450" y="520" class="tagline" style="font-style: normal;">The Scientific Data Foundation for Accelerated Life Sciences R&amp;D.</text>
</svg>
